<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudBus - Bus Pass System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            CloudBus
        </div>

        <div class="nav-links">

            {% if session.get("user_id") %}

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('logout') }}">
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('login') }}">
                    Login
                </a>

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>


    <main class="hero">

        <div class="hero-content">

            <h1>
                Cloud-Based Bus Pass System
            </h1>

            <p>
                Book bus tickets quickly, securely and reliably.
            </p>

            {% if session.get("user_id") %}

                <a
                    class="button"
                    href="{{ url_for('dashboard') }}"
                >
                    Go to Dashboard
                </a>

            {% else %}

                <a
                    class="button"
                    href="{{ url_for('register') }}"
                >
                    Get Started
                </a>

            {% endif %}

        </div>

    </main>

</body>

</html>
